<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel PKS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#26282c">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel PKS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"></script>
<script src="../supa.js"></script>
<style>
/* Painel PKS no celular: identidade do layout 2026 do Sistema PKS (grafite, vermelho PKS, barras fire brick). */
:root{--red:#d71f26;--red-bg:#fdecec;--top:#26282c;--top-ink:#f3f4f5;--top-mut:#a7abb1;--bg:#f1f2f4;--panel:#fff;--sunken:#f5f6f7;--line:#e3e5e8;--ink:#1d1f22;--muted:#5d6168;
  --bar:#b22222;--bar-on:#7d1515;--bar-fut:#e3e5e8;--ok:#17693b;--ok-bg:#d9f0e2;--warn:#8a4f00;--warn-bg:#fbeacb;--stop:#b3261e;--stop-bg:#fae1df;--info:#1d5a8a;--info-bg:#deedf8;
  --fonte:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color-scheme:light}
:root[data-theme="dark"]{--red:#e3262d;--red-bg:#3d1c1e;--top:#18191c;--bg:#1f2124;--panel:#2a2c30;--sunken:#303338;--line:#3a3d42;--ink:#f1f2f4;--muted:#a8acb2;
  --bar:#d24a45;--bar-on:#f0a19b;--bar-fut:#3a3d42;--ok:#7fd8a2;--ok-bg:#1f4630;--warn:#f2bd6b;--warn-bg:#4a3a1c;--stop:#f29b95;--stop-bg:#552828;--info:#8cc4ee;--info-bg:#223f57;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--fonte);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.topo{position:sticky;top:0;z-index:10;background:var(--top);color:var(--top-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px}
.selo{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--red);color:#fff;font:700 14px var(--fonte);flex:none}
.topo-t{flex:1;min-width:0;display:grid;line-height:1.2}.topo-t small{color:var(--top-mut);font-size:12px}.topo-t h1{margin:0;font:700 18px var(--fonte)}
.tema{all:unset;cursor:pointer;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid #3a3d42}
.tema svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.tema:focus-visible{outline:2px solid #fff}
.perfil{display:flex;align-items:center;font-size:12px;color:var(--top-mut)}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:12px}main>*,.linha>*,.l1>*{min-width:0}
.vazio{padding:28px 12px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.heroi{background:var(--top);color:var(--top-ink);border-radius:16px;padding:16px 18px;display:grid;gap:4px;border-left:5px solid var(--red)}
.heroi span{font-size:13px;color:var(--top-mut)}.heroi b{font:700 30px var(--fonte);letter-spacing:-.01em}.heroi small{font-size:12.5px;color:var(--top-mut)}.heroi em{font-style:normal;color:#ff9a9e;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}.kpi span{font-size:12.5px;color:var(--muted)}.kpi b{font:700 19px var(--fonte)}
.cartao{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}
.cab{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.cab h2{margin:0;font:700 15.5px var(--fonte)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--panel)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--top);color:#fff}
.seg.largo button{flex:1}
.graf{width:100%;height:auto;display:block;overflow:visible}
.g-eixo{stroke:var(--line)}.g-bar{fill:var(--bar)}.g-bar.on{fill:var(--bar-on)}.g-bar.fut{fill:var(--bar-fut)}
.g-col{cursor:pointer}.g-col:focus{outline:none}.g-col:focus-visible .g-bar{stroke:var(--ink);stroke-width:1.5}
.g-rot{font:11px var(--fonte);fill:var(--muted);text-anchor:middle}.g-rot.on{fill:var(--ink);font-weight:700}
.g-val{font:600 9.5px var(--fonte);fill:var(--ink);text-anchor:middle}
.sel{margin:0;font-size:13.5px;color:var(--muted)}.sel b{color:var(--ink)}
.mudo{color:var(--muted);font-size:13px;margin:0}
.lista{list-style:none;margin:0;padding:0;display:grid}
.lista>li{border-top:1px solid var(--line)}.lista>li:first-child{border-top:0}
.linha{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:3px;width:100%;padding:11px 2px}
.linha:focus-visible{outline:2px solid var(--red);outline-offset:-2px;border-radius:8px}
.l1{display:flex;justify-content:space-between;align-items:center;gap:10px}.l1 b{font-weight:600}.l2{font-size:12.5px;color:var(--muted)}
.corta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:right;white-space:nowrap}
.tag{font-style:normal;font-size:11.5px;padding:1px 6px;border-radius:6px;background:var(--sunken)}
.det{display:grid;gap:2px;padding:2px 0 12px}
.item{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:10px;background:var(--sunken);font-size:13.5px}
.item span{display:grid;min-width:0}.item small{color:var(--muted);font-size:12px}.item b{font-weight:600}
.item.tot{background:transparent;font-weight:700;padding-top:6px}.item.destaque{outline:1px solid var(--line)}
.item .num{display:grid;justify-items:end}
.mais{all:unset;cursor:pointer;justify-self:center;padding:9px 18px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:14px}
.busca{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.busca svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:1.8;flex:none}
.busca input{all:unset;flex:1;min-width:0;padding:11px 0;font-size:16px}
.cab-lista{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px}
.cartoes{gap:8px}.cartoes>li{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:0 12px}.cartoes>li:first-child{border-top:1px solid var(--line)}
.l3{display:flex;align-items:flex-end;gap:16px}.l3>span{display:grid}.l3 small{font-size:11.5px;color:var(--muted)}.l3 b{font-weight:700;font-size:15px}.l3 i{font-style:normal;font-weight:400;font-size:11.5px;color:var(--muted)}
.spark{width:60px;height:22px;margin-left:auto;color:var(--bar)}.spark polyline{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.spark circle{fill:currentColor}
.var{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.var.sobe{background:var(--stop-bg);color:var(--stop)}.var.cai{background:var(--ok-bg);color:var(--ok)}
.t-sobe{color:var(--stop)}.t-cai{color:var(--ok)}.t-ok{color:var(--ok)}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.pill.aberta{background:var(--sunken);color:var(--muted)}.pill.parcial{background:var(--warn-bg);color:var(--warn)}.pill.atraso{background:var(--stop-bg);color:var(--stop)}.pill.ok{background:var(--ok-bg);color:var(--ok)}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}.prog b{color:var(--ink)}
.barra{flex:1;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}.barra i{display:block;height:100%;background:var(--red)}
.rodape{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}
nav.abas{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.abas button{all:unset;cursor:pointer;flex:1;max-width:200px;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted)}
nav.abas svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.abas button[aria-current="page"]{color:var(--red);background:var(--red-bg)}
nav.abas button:focus-visible{outline:2px solid var(--red)}
@media (min-width:700px){main{padding-top:20px}}
</style>
</head>
<body>
<header class="topo"><span class="selo" aria-hidden="true">PKS</span><div class="topo-t"><small>Painel PKS · <span id="hoje"></span></small><h1 id="titulo">Painel</h1></div>
<button type="button" class="tema" id="tema" aria-label="Trocar entre tema claro e escuro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button><div class="perfil"></div></header>
<main id="tela"><div class="vazio">Abrindo o painel…</div></main>
<nav class="abas" id="nav" aria-label="Telas" hidden></nav>
<script src="app.js"></script>
</body>
</html>
