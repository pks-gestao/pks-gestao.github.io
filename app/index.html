<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel PKS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f1f2f4">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel PKS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"></script>
<script src="../supa.js"></script>
<style>
/* Painel PKS no celular, no formato do Painel Vaeso, com a identidade do Sistema PKS (grafite, vermelho PKS, fire brick nos gráficos). */
:root{--red:#d71f26;--red-bg:#fdecec;--esc:#26282c;--esc-2:#33363b;--esc-ink:#f3f4f5;--esc-mut:#b9bdc3;--bg:#f1f2f4;--panel:#fff;--sunken:#f4f5f7;--line:#e3e5e8;--ink:#1d1f22;--muted:#5d6168;
  --serie:#b22222;--area:rgba(178,34,34,.10);--c1:#d71f26;--c2:#e0902b;--c3:#5d6168;--c4:#3f7cc4;--pos:#17693b;--neg:#b3261e;--ok-bg:#d9f0e2;--stop-bg:#fae1df;
  --fonte:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color-scheme:light}
:root[data-theme="dark"]{--red:#e3262d;--red-bg:#3d1c1e;--esc:#2a2c30;--esc-2:#36393e;--bg:#1a1b1e;--panel:#232528;--sunken:#2c2f33;--line:#373a3f;--ink:#f1f2f4;--muted:#a8acb2;
  --serie:#e0605b;--area:rgba(224,96,91,.14);--c3:#a8acb2;--c4:#6fa3e0;--pos:#7fd8a2;--neg:#f29b95;--ok-bg:#1f4630;--stop-bg:#552828;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--fonte);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
main{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
main>*{min-width:0}
.vazio{padding:28px 12px;text-align:center;color:var(--muted)}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.selo{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;font:700 12.5px var(--fonte)}
.selo.grande{width:46px;height:46px;font-size:15px;border-radius:12px}
/* topo */
.faixa{display:flex;align-items:center;gap:10px;background:var(--esc);color:var(--esc-ink);border-radius:16px;padding:12px 14px 12px 18px;border-bottom:3px solid var(--red)}
.faixa b{flex:1;font:700 16px var(--fonte);letter-spacing:.02em}
.volta{display:grid;place-items:center;width:30px;height:30px;margin-left:-8px;border-radius:8px}.volta svg{width:20px;height:20px}
.barra{display:flex;gap:8px;align-items:center}.cresce{flex:1}
.mes{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.mes .ic-mes{width:17px;height:17px;color:var(--muted)}
.mes select{all:unset;flex:1;padding:10px 0;font-weight:600;font-size:14.5px;cursor:pointer}
.bt-ic{all:unset;cursor:pointer;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.bt-ic svg{width:18px;height:18px}
.bt-ic:focus-visible,.bloco:focus-visible,.volta:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.atual{margin:-6px 4px 0;font-size:12.5px;color:var(--muted)}
/* início */
.ola{padding:10px 4px 2px}.olho{font:700 12px var(--fonte);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ola h1{margin:6px 0 4px;font:700 32px/1.08 var(--fonte);letter-spacing:-.02em}.ola p{margin:0;color:var(--muted);font-size:16px}
.blocos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bloco{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 14px;display:grid;gap:8px;align-content:start;min-height:170px}
.bloco:active{background:var(--sunken)}
.bola{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--red-bg);color:var(--red)}.bola svg{width:22px;height:22px}
.bt-t{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}.bt-t b{font:700 17px/1.2 var(--fonte)}
.chev{width:16px;height:16px;color:var(--muted);flex:none}
.bloco small{color:var(--muted);font-size:13.5px;line-height:1.35}
.bloco em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--sunken);border-radius:8px;padding:4px 8px;justify-self:start}
.marca{display:flex;align-items:center;gap:12px;padding:18px 4px 4px;color:var(--muted);font:600 13px var(--fonte);letter-spacing:.06em;text-transform:uppercase}.marca small{font-weight:400;letter-spacing:.02em;text-transform:none}
/* destaque */
.heroi{background:var(--esc);color:var(--esc-ink);border-radius:18px;padding:18px 18px 16px;display:grid;justify-items:center;gap:6px;text-align:center;border-bottom:3px solid var(--red)}
.heroi .olho{color:var(--esc-mut)}.heroi b{font:700 34px var(--fonte);letter-spacing:-.01em}
.pilula{background:var(--esc-2);border-radius:12px;padding:7px 14px;font-size:13px;color:var(--esc-mut)}.pilula strong{color:var(--esc-ink)}
.heroi .neg{color:#ff9a9e;font-style:normal;font-weight:700}
/* cartões */
.cartao{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;min-width:0}
.cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cab h2{display:flex;align-items:center;gap:8px;margin:0;font:700 16px var(--fonte)}.cab h2 .ic{width:18px;height:18px;color:var(--muted)}
.mudo{color:var(--muted);font-size:13px;margin:0}
.seg{display:flex;background:var(--sunken);border-radius:11px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 11px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--esc);color:#fff}
.leg{display:flex;align-items:center;gap:6px;margin:-4px 0 0;font-size:12.5px;color:var(--muted)}.leg i{width:8px;height:8px;border-radius:50%;background:var(--serie)}
.graf{width:100%;height:auto;display:block;overflow:visible}.graf text{stroke:none}
.g-grade{stroke:var(--line)}.g-ey{font:10px var(--fonte);fill:var(--muted);text-anchor:end}.g-ex{font:10.5px var(--fonte);fill:var(--muted);text-anchor:middle}
.g-area{fill:var(--area);stroke:none}.g-linha{fill:none;stroke:var(--serie);stroke-width:2.2}
.g-pt{fill:var(--panel);stroke:var(--serie);stroke-width:2}.g-pt.parcial{stroke-dasharray:2 2}
.g-v{font:600 9.5px var(--fonte);fill:var(--ink);text-anchor:middle}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c1);border-radius:14px;padding:11px 12px;display:grid;gap:2px;align-content:start}
.kpi.c2{border-top-color:var(--c2)}.kpi.c3{border-top-color:var(--c3)}.kpi.c4{border-top-color:var(--c4)}
.kpi span{font-size:12.5px;color:var(--muted)}.kpi b{font:700 19px var(--fonte)}.kpi small{font-size:11.5px;color:var(--muted)}
.neg{color:var(--neg)}.pos{color:var(--pos)}.forte{font-weight:700}
.bt-dobra{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mini li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--sunken);font-size:13.5px}
.mini li>span{display:grid;min-width:0}.mini small{color:var(--muted);font-size:12px}.mini .n{text-align:right;flex:none}
.hbar{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.hbar li{display:grid;grid-template-columns:minmax(0,112px) minmax(0,1fr) auto;align-items:center;gap:8px;font-size:13px}
.hbar.ano li{grid-template-columns:34px minmax(0,1fr) auto}
.hb-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hb-b{position:relative;height:12px}.hb-b i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--serie)}
.hb-b i.a{background:var(--serie);opacity:.55}.hb-b i.p{background:transparent;border:1.5px dashed var(--serie);opacity:.8}
.hbar b{font-weight:600;white-space:nowrap}.hbar small{color:var(--muted);font-weight:400}
.leg3{display:flex;gap:12px;flex-wrap:wrap;margin:-4px 0 0;font-size:12px;color:var(--muted)}.leg3 span{display:flex;align-items:center;gap:5px}
.leg3 i{width:10px;height:10px;border-radius:3px;background:var(--serie)}.leg3 i.a{opacity:.55}.leg3 i.p{background:transparent;border:1.5px dashed var(--serie)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips button{all:unset;cursor:pointer;white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--esc);color:#fff;border-color:var(--esc)}
.precos,.ordens{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.precos>li,.ordens>li{border:1px solid var(--line);border-left:3px solid var(--esc);border-radius:12px;overflow:hidden}
.preco,.ordem{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px}.preco{display:grid;gap:3px}.p1,.p2{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}.p1 b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.p2 small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preco:focus-visible,.ordem:focus-visible,.bt-dobra:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.pn,.on{display:grid;flex:1;min-width:0}.pn b,.on b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pn small,.on small{color:var(--muted);font-size:12px}
.pv{display:flex;align-items:baseline;gap:1px;flex:none}.pv b{font:700 16.5px var(--fonte)}.pv small{font-size:11.5px;color:var(--muted)}
.var{flex:none;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--sunken);color:var(--muted);min-width:44px;text-align:center}
.var.sobe{background:var(--stop-bg);color:var(--neg)}.var.cai{background:var(--ok-bg);color:var(--pos)}
.aberta .chev{transform:rotate(90deg)}
.tab{padding:0 10px 10px;display:grid;gap:6px;overflow-x:auto}
.tab table{border-collapse:collapse;width:100%;font-size:12.5px}
.tab th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tab td{padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}.tab tr:last-child td{border-bottom:0}
.tab td:nth-child(2){white-space:normal;min-width:80px}.tab .n{text-align:right}
.ordens>li{border-left-color:var(--red)}
.op{display:grid;gap:3px;width:108px;flex:none}.op small{font-size:11.5px;color:var(--muted);text-align:right}
.barra{}.op .barra{display:block;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}.op .barra i{display:block;height:100%;background:var(--red)}
.ordens .mini{padding:0 10px 10px}
.mais{all:unset;cursor:pointer;justify-self:center;padding:9px 18px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:14px}
.rodape{font-size:12px;color:var(--muted);text-align:center;margin:0}
</style>
</head>
<body>
<main id="tela"><div class="vazio">Abrindo o painel…</div></main>
<div class="perfil" hidden></div>
<script src="app.js"></script>
</body>
</html>
