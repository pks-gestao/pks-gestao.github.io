<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"></script><script src="supa.js"></script></head><body><title>Sistema PKS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: faixa grafite com a marca PKS, abas com indicador vermelho e tabelas densas sobre cinza claro. */
:root{
  --bg:#eef0f2;--panel:#ffffff;--sunken:#e3e6e9;--line:#cfd3d8;--ink:#23272b;--muted:#5d646b;
  --band:#4a4f55;--band-ink:#ffffff;--band-muted:#d5d8dc;--band-tile:#5a6066;--brand:#d8232a;
  --accent:#4a4f55;--accent-ink:#ffffff;--accent-soft:#e3e6e9;
  --open:#4c535a;--open-bg:#e3e6e9;--ready:#8a4f00;--ready-bg:#fbeacb;--done:#17693b;--done-bg:#d9f0e2;--stop:#a32222;--stop-bg:#fae1df;--info:#1d5a8a;--info-bg:#deedf8;--pay:#6a2c91;--pay-bg:#efe3f7;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2b2e32;--panel:#35393e;--sunken:#3f4349;--line:#50555b;--ink:#eceef0;--muted:#b4b9bf;
  --band:#4a4f55;--band-ink:#ffffff;--band-muted:#d5d8dc;--band-tile:#5a6066;--brand:#e8383f;
  --accent:#d5d8dc;--accent-ink:#2b2e32;--accent-soft:#3f4349;
  --open:#c9ced3;--open-bg:#4a4f55;--ready:#f2bd6b;--ready-bg:#4a3a1c;--done:#7fd8a2;--done-bg:#1f4630;--stop:#f29b95;--stop-bg:#552828;--info:#8cc4ee;--info-bg:#223f57;--pay:#d9b3f2;--pay-bg:#4a2f5c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2b2e32;--panel:#35393e;--sunken:#3f4349;--line:#50555b;--ink:#eceef0;--muted:#b4b9bf;
  --band:#4a4f55;--band-ink:#ffffff;--band-muted:#d5d8dc;--band-tile:#5a6066;--brand:#e8383f;
  --accent:#d5d8dc;--accent-ink:#2b2e32;--accent-soft:#3f4349;
  --open:#c9ced3;--open-bg:#4a4f55;--ready:#f2bd6b;--ready-bg:#4a3a1c;--done:#7fd8a2;--done-bg:#1f4630;--stop:#f29b95;--stop-bg:#552828;--info:#8cc4ee;--info-bg:#223f57;--pay:#d9b3f2;--pay-bg:#4a2f5c;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.1}h2{font-size:20px}h3{font-size:16px}
p{margin:0;max-width:75ch}
.mono{font-family:var(--mono);font-size:12.5px}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.muted{color:var(--muted)}.small{font-size:12.5px}
.band{background:var(--band);color:var(--band-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.band-in{max-width:1288px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:84px;height:62px;flex:none;overflow:hidden;position:relative}
.logo img{position:absolute;left:-58px;top:-24px;width:200px;max-width:none;mix-blend-mode:lighten}
.brand p{color:var(--band-muted)}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.count{background:var(--band-tile);padding:6px 12px;min-width:112px;display:grid;gap:0}
.count b{font:600 22px/1.2 var(--display);font-variant-numeric:tabular-nums;color:var(--band-ink)}.count span{font-size:12px;color:var(--band-muted)}
.count.ready{box-shadow:inset 3px 0 0 #f2bd6b}.count.done{box-shadow:inset 3px 0 0 #7fd8a2}.count.open{box-shadow:inset 3px 0 0 var(--band-muted)}
nav.tabs{display:flex;gap:2px;box-shadow:inset 0 -2px 0 var(--line);overflow-x:auto;overflow-y:hidden}
nav.tabs a{padding:8px 16px;color:var(--muted);text-decoration:none;font:600 15px var(--display);white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.note{background:var(--sunken);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.note.ready{background:var(--ready-bg);color:var(--ready)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);background:var(--panel)}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;font:500 13px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=search]{font:14px var(--body);padding:6px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);flex:1 1 220px;min-width:0;max-width:420px}
button.act{font:500 13px var(--body);padding:6px 12px;border:1px solid var(--accent);background:var(--panel);color:var(--accent);cursor:pointer}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 12px var(--body);color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunken);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}tr.row:hover td{background:var(--sunken)}
.name{font-weight:500;max-width:300px}
.pill{display:inline-block;font:500 12px var(--body);padding:2px 8px;white-space:nowrap}
.p-open{background:var(--open-bg);color:var(--open)}.p-ready{background:var(--ready-bg);color:var(--ready)}.p-done{background:var(--done-bg);color:var(--done)}.p-stop{background:var(--stop-bg);color:var(--stop)}.p-warn{background:var(--ready-bg);color:var(--ready)}.p-info{background:var(--info-bg);color:var(--info)}.p-pay{background:var(--pay-bg);color:var(--pay)}
.paybox{background:var(--panel);border:1px solid var(--line);box-shadow:inset 4px 0 0 var(--pay);padding:12px 14px 12px 18px;display:grid;gap:10px}
select.st{font:500 12.5px var(--body);padding:3px 4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:160px}
select.st[data-v="pronta"]{background:var(--ready-bg);color:var(--ready);border-color:var(--ready)}
td.detail{background:var(--bg);padding:14px}
.detail-grid{display:grid;gap:14px;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 18px}
.facts div{min-width:0;overflow-wrap:anywhere}.facts dt{font-size:12px;color:var(--muted)}.facts dd{margin:0;font-weight:500}
dl{margin:0}
ul.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.alerts li{display:flex;gap:8px;align-items:flex-start}
ul.alerts .txt{min-width:0}
.inner{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
.diff{color:var(--stop);font-weight:600}
.section{display:grid;gap:10px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.rule{background:var(--panel);border:1px solid var(--line);padding:10px 14px;display:grid;gap:4px;align-content:start}
.src{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--muted);text-transform:uppercase}
.src.you{color:var(--accent)}
ol.decide{margin:0;padding-left:20px;display:grid;gap:6px;max-width:85ch}
.more{justify-self:center}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;z-index:20}
.empty{padding:24px;text-align:center;color:var(--muted)}
.tesbar{display:flex;gap:4px;flex-wrap:wrap}
.count.period{border:0;font:inherit;text-align:left;cursor:pointer;box-shadow:inset 3px 0 0 var(--brand)}
.count.period:hover{background:var(--band-muted)}.count.period:hover b,.count.period:hover span{color:var(--band)}
.perbox{background:var(--panel);border:1px solid var(--line);box-shadow:inset 4px 0 0 var(--brand);padding:12px 14px 12px 18px;display:grid;gap:10px}
.perlist{display:flex;flex-wrap:wrap;gap:6px}
select.ent{font:500 12.5px var(--body);padding:3px 4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:118px}
select.ent[data-v="aberto"]{background:var(--open-bg);color:var(--open)}
select.ent[data-v="recebida"]{background:var(--info-bg);color:var(--info);border-color:var(--info)}
select.ent[data-v="lancada"]{background:var(--done-bg);color:var(--done);border-color:var(--done)}
td.stcol{text-align:right;white-space:nowrap}
.natop{display:block;max-width:190px;min-width:120px;font-size:12.5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.decs{display:grid;gap:8px;min-width:170px}
.dec{display:grid;gap:3px}
.dec select,.dec input{font:500 12.5px var(--body);padding:3px 4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%;max-width:210px}
.dec select.feita,.dec input.feita{border-color:var(--done);background:var(--done-bg);color:var(--done)}
.dec select.esc{font-size:11.5px;font-weight:400;color:var(--muted);padding:2px 3px}
th button.sort{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:baseline;white-space:nowrap}
th button.sort:hover{color:var(--ink)}
th button.sort:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
th button.sort i{font-style:normal;font-size:10px;opacity:.45}
th[aria-sort] button.sort{color:var(--ink)}th[aria-sort] button.sort i{opacity:1}
.timebox{background:var(--panel);border:1px solid var(--line);box-shadow:inset 4px 0 0 var(--done);padding:12px 14px 12px 18px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center}
.timebox .big{font:600 26px/1.15 var(--display);font-variant-numeric:tabular-nums;color:var(--done)}
.timebox .val{font:600 18px/1.25 var(--display);font-variant-numeric:tabular-nums}
.timebox label{display:grid;gap:2px}
.timebox input{font:600 15px var(--body);width:72px;padding:4px 8px;border:1px solid var(--line);background:var(--sunken);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){tr.row td{transition:background .1s}}

/* Mascote: o Polenta, palito de polenta frita com luvas. Aparece no canto só enquanto trabalha. */
.pol{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.pol[hidden]{display:none!important}
.pol svg{flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.pol .boneco{width:78px;height:91px}
.pol .cena{display:none;width:200px;height:145px}
.pol.estudo .cena{display:block}.pol.estudo .boneco{display:none}
.polbtn{all:unset;pointer-events:auto;cursor:pointer;display:block;line-height:0}
.polbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#polTxt{max-height:min(55vh,300px);overflow:auto}
.pol-lista{margin:6px 0 0;padding-left:16px;display:grid;gap:3px;font-size:12px}
.polmenu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;min-width:180px;padding:4px 0}
.polmenu[hidden]{display:none}
.polmenu button{all:unset;cursor:pointer;padding:7px 14px;font:500 13px var(--body);color:var(--ink)}
.polmenu button:hover,.polmenu button:focus-visible{background:var(--sunken)}
.pol .bal{pointer-events:auto;position:relative;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);padding:8px 26px 8px 12px;max-width:230px;font-size:12.5px;line-height:1.35;margin-bottom:46px}
.pol .bal::after{content:"";position:absolute;right:-7px;bottom:12px;width:12px;height:12px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(-45deg)}
.pol .bal b{display:block;font:600 13px var(--display)}
.pol .bal button{all:unset;cursor:pointer;position:absolute;top:3px;right:6px;color:var(--muted);font-size:15px;line-height:1;padding:2px}
.pol .bal button:focus-visible{outline:2px solid var(--accent)}
.pol.min .bal{display:none}

.chamar{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);padding:4px 12px 4px 6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.chamar:hover{border-color:var(--accent)}
.chamar[aria-pressed="true"]{border-color:#D98E22;box-shadow:inset 0 0 0 1px #D98E22}
.chamar svg{width:20px;height:24px;flex:none}
.pol .bal .acoes{display:flex;gap:6px;margin-top:6px}
.pol .bal .acoes button{all:unset;position:static;cursor:pointer;font:500 12px var(--body);padding:3px 9px;border:1px solid var(--accent);color:var(--accent)}
body.pol-on .toast{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
@media (max-width:600px){.pol .boneco{width:58px;height:68px}.pol .cena{width:150px;height:109px}.pol .bal{max-width:170px;margin-bottom:34px}}
/* Animações do Polenta: rodam mesmo com "reduzir animações" ligado, a pedido do usuário. */
  .pol{animation:polIn .45s ease-out}
  .pol .corpo{animation:polBob 3.2s ease-in-out infinite;transform-origin:60px 120px}
  .pol .olhos{animation:polPisca 4.6s infinite;transform-origin:60px 56px}
  .pol .acena{animation:polAcena 2.4s ease-in-out infinite;transform-origin:92px 74px}
  .pol.chega{animation:none}
  .pol.chega .polbtn{animation:polPula 1.15s ease-out}
  .pol.chega .bal{animation:polBal .3s 1s both}
  .pol.danca .boneco{animation:polDanca 1.8s ease-in-out;transform-origin:50% 100%}
  .pol.danca .acena{animation:polAcena .5s ease-in-out infinite}
  .pol .pagina{animation:polFolha 2.6s ease-in-out infinite;transform-origin:120px 104px}
  .pol .pupilas{animation:polLe 2.6s ease-in-out infinite}
  .pol .luz{animation:polLuz 3s ease-in-out infinite}
@keyframes polPula{0%{transform:translate(170px,0)}14%{transform:translate(135px,-36px)}28%{transform:translate(100px,0)}42%{transform:translate(66px,-28px)}56%{transform:translate(36px,0)}70%{transform:translate(14px,-15px)}84%{transform:translate(0,0) scale(1.06,.9)}100%{transform:none}}
@keyframes polBal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes polDanca{0%,100%{transform:none}12%{transform:translateY(-12px) rotate(-12deg)}25%{transform:rotate(10deg)}37%{transform:translateY(-14px) rotate(-8deg)}50%{transform:translateX(-8px) rotate(14deg)}62%{transform:translateY(-10px) rotate(-12deg)}75%{transform:translateX(6px) rotate(8deg)}88%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes polFolha{0%,35%{transform:scaleX(1);opacity:1}70%{transform:scaleX(-1);opacity:1}92%{transform:scaleX(-1);opacity:0}100%{transform:scaleX(1);opacity:0}}
@keyframes polLe{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
@keyframes polLuz{0%,100%{opacity:.55}50%{opacity:.75}}
@keyframes polIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes polBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(-1deg)}}
@keyframes polPisca{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes polAcena{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-16deg)}75%{transform:rotate(6deg)}85%{transform:rotate(-12deg)}}

/* Menu lateral por módulo: barra escura em cinza, com logo, e painel claro de subitens */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:#3a3f45;color:#e3e6e9;display:flex;flex-direction:column;gap:10px;padding:10px 10px 16px}
.side-logo{display:flex;align-items:center;gap:8px;padding:2px 2px 10px;border-bottom:1px solid #4d5359}
.side-logo .logo{width:64px;height:48px}
.side-logo .logo img{left:-44px;top:-18px;width:152px}
.side-nome{display:grid;line-height:1.2}.side-nome b{font:600 15px var(--display);color:#fff}.side-nome span{font-size:12px;color:#b4b9bf}
.mods{display:grid;gap:4px}
.mod{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#e3e6e9;font:500 14px var(--body)}
.mod svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mod span{flex:1}
.mod .chev{width:14px;height:14px;opacity:.65}
.mod:hover{background:#4a5057}
.mod.aberto{background:#4a5057}
.mod.ativo{background:#d5d8dc;color:#2b2e32;font-weight:600}
.mod:focus-visible{outline:2px solid #fff;outline-offset:1px}
.subnav{position:fixed;left:220px;top:0;z-index:40;width:220px;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);box-shadow:8px 0 24px rgba(0,0,0,.14);padding:22px 10px;display:flex;flex-direction:column;gap:2px}
.subnav[hidden]{display:none}
.sub-t{font:600 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 12px}
.subnav a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
.subnav a i{width:7px;height:7px;border:1.5px solid var(--muted);border-radius:50%;flex:none}
.subnav a:hover{background:var(--sunken)}
.subnav a[aria-current="page"]{background:var(--sunken);font-weight:600}
.subnav a[aria-current="page"] i{background:var(--ink);border-color:var(--ink)}
.topo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:8px}
.topo .chamar{margin-left:0}
.notasband{background:var(--band);color:var(--band-ink);padding:10px 12px;border-radius:8px}
.notasband[hidden]{display:none}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px}.side-logo{border:0;padding:0}.mods{grid-auto-flow:column}.mod .chev{display:none}.subnav{position:static;width:auto;box-shadow:none;height:auto;flex-direction:row;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line)}.sub-t{display:none}.subnav a{white-space:nowrap}}
.filtros{align-items:flex-end;gap:10px}
.campo{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.campo.cresce{flex:1 1 220px;max-width:420px}
.campo input,.campo select{font:13px var(--body);padding:5px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
.campo select{max-width:280px}
tr.tot td{background:var(--sunken);font-weight:500}
.pagin{justify-content:center}
.cli-grid{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.cli-grid{grid-template-columns:1fr}}
.cli-lista{display:grid;gap:4px;max-height:75vh;overflow:auto}
.cli-item{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 10px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.cli-item.on{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.cli-item:focus-visible{outline:2px solid var(--accent)}
.cli-det{display:grid;gap:10px;min-width:0}
input.custo{font:13px var(--mono);width:120px;text-align:right;padding:3px 6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}

const S={notas:[],meta:null,padrao:null,hist:null,db:null,dbState:'loading',fStatus:'todas',q:'',open:new Set(),hq:'',hTipo:'todas',hLim:40,hOpen:new Set(),pOpen:new Set(),eTipo:'NF-e',eSt:'todas',eq:'',eOpen:new Set(),tempo:null,periodos:null,perOpen:false,regras:{},dEdit:null,dDraft:{},sort:{},fq:'',fOpen:new Set(),fLim:30};

/* Tema claro ou escuro: escolha de cada pessoa, guardada neste navegador. */

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function subVis(A){const out=[];let h=null;for(const x of A){if(x[0]==='-'){h=x;continue}if(!podeVer(x[0]))continue;if(h){out.push(h);h=null}out.push(x)}return out}
function desenhaMenu(t){
  const atual=modDe(t),aberto=MODS.find(m=>m[0]===S.modAberto)||atual,sub=!!S.subAberto;$('subnav').hidden=!sub;
  const VIS=MODS.filter(m=>m[0]!=='config'&&m[2].some(a=>a[0]!=='-'&&podeVer(a[0])));$('cfgBt').hidden=!S.acesso.adm;$('cfgBt').classList.toggle('ativo',t==='config');
  $('mods').innerHTML=VIS.map(([k,l])=>`<button type="button" class="mod${k===atual[0]?' ativo':''}${sub&&k===aberto[0]?' aberto':''}" data-mod="${k}" aria-expanded="${sub&&k===aberto[0]}" aria-controls="subnav"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg><span>${l}</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`).join('');
  $('subnav').innerHTML=`<button type="button" class="sub-volta" id="subVolta">‹ Voltar</button><span class="sub-t">${aberto[1]}</span>`+subVis(aberto[2]).map(([a,l])=>a==='-'?`<span class="sub-h">${l}</span>`:`<a href="#${a}" data-tab="${a}"${a===t?' aria-current="page"':''}><i aria-hidden="true"></i>${l}</a>`).join('');
}
function route(){let t=ABAS.includes(location.hash.slice(1))?location.hash.slice(1):'home';
  if(!podeVer(t)){const p=ABAS.find(a=>a!=='config'&&podeVer(a));if(p&&p!==t){location.hash='#'+p;return}if(!p){mostraBloqueio();return}}
  $('v-bloqueio').hidden=true;
  /* Ao trocar de aba, ela abre na tela inicial: sem filtros, busca ou itens abertos da visita anterior. */
  if(t!==S.abaAnt){if(S.abaAnt!==undefined){Object.assign(S,{fStatus:'todas',q:'',qRaw:undefined,hq:'',hqRaw:undefined,hTipo:'todas',hLim:40,eTipo:'NF-e',eSt:'todas',eq:'',eqRaw:undefined,fq:'',fqRaw:undefined,fLim:30,sort:{},perOpen:false});for(const x of [S.open,S.hOpen,S.pOpen,S.eOpen,S.fOpen])x.clear();
    try{({notas:renderNotas,entrada:renderEntrada,lancadas:renderLancadas,padrao:renderPadrao})[t]?.()}catch{}scrollTo(0,0);document.querySelectorAll('main,.main,.conteudo').forEach(e=>e.scrollTop=0)}S.abaAnt=t}
  for(const k of ABAS)$('v-'+k).hidden=k!==t;
  S.modAberto=modDe(t)[0];S.subAberto=false;desenhaMenu(t);
  const m=modDe(t),nomeT=m[2].find(a=>a[0]===t)[1];
  if(t==='home'){const hr=new Date().getHours();$('olhoMod').textContent='Painel de controle';$('tituloMod').innerHTML=(hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite')+(S.nome||S.perfil?', <span class="nome-red">'+esc(S.nome||S.perfil)+'</span>':'');$('subMod').textContent='Acompanhe os principais indicadores e acesse rapidamente as áreas do sistema.';$('subMod').hidden=false;$('trilha').innerHTML='Sistema PKS<span class="sep">/</span><b>Home</b>'}
  else{$('olhoMod').textContent=m[1];$('tituloMod').textContent=nomeT;$('subMod').hidden=true;$('trilha').innerHTML='Sistema PKS<span class="sep">/</span>'+m[1]+(m[1]!==nomeT?'<span class="sep">/</span><b>'+nomeT+'</b>':'')}

  const nb=$('countsBox');if(nb)nb.hidden=t!=='notas';document.querySelector('.topo').hidden=['nfe','pcpvaeso','estoque'].includes(t);const pp=$('perPanel');if(pp&&t!=='notas')pp.hidden=true;
  if(t==='config')renderConfig();

  if(S.polChamado){S.polIdx=0;S.polMais=false;renderPolenta()}}
const abaAtual=()=>ABAS.includes(location.hash.slice(1))?location.hash.slice(1):'home';

document.addEventListener('click',e=>{const b=e.target.closest('button.mod');
  if(b){const k=b.dataset.mod;if(k==='home'){S.subAberto=false;location.hash='#home';route();return}if(S.subAberto&&S.modAberto===k){fechaSub(true);return}S.modAberto=k;S.subAberto=true;desenhaMenu(abaAtual());$('subnav').querySelector('a')?.focus();return}
  const a=e.target.closest('#subnav a');if(a){if(a.getAttribute('href')===location.hash)fechaSub(false);return}
  if(S.subAberto&&!e.target.closest('#subnav'))fechaSub(false)});

const vaiBusca=v=>{v=(v||'').trim().toLowerCase();if(!v)return;const TV=TELAS.filter(x=>podeVer(x[0]));const a=TV.find(([,l])=>l.toLowerCase()===v)||TV.find(([,l])=>l.toLowerCase().includes(v));if(a){location.hash='#'+a[0];$('buscaSis').value='';$('buscaSis').blur()}else toast('Nenhuma tela com esse nome.')};

/* Acesso por pessoa. Administrador (dono ou editor do artifact) vê tudo e entra em Configurações.
   Os demais precisam estar em usuarios/<id do Claude> com setor e abas liberadas; sem cadastro, nada aparece.
   Isso só esconde telas: quem tem o link do artifact consegue ler os dados publicados. */
const SETORES=['Financeiro','PCP/Compras','Diretoria','Logística'];
S.acesso={pronto:false,adm:false,reg:null};S.usuarios=[];S.cfgHits=[];
function podeVer(t){const A=S.acesso;if(!A.pronto)return false;if(A.adm)return true;if(t==='config')return false;/* Movimentações segue a permissão de Estoque */return !!(A.reg&&(A.reg.abas||[]).includes(t==='estmov'?'estoque':t))}
function mostraBloqueio(){for(const k of ABAS)$('v-'+k).hidden=true;const b=$('v-bloqueio');b.hidden=false;
  b.innerHTML=S.acesso.pronto?'<div class="empty"><b>Seu acesso ainda não foi liberado.</b><br>Peça ao administrador do Sistema PKS para liberar as telas do seu setor.</div>':'<div class="empty">Verificando o seu acesso…</div>';
  $('olhoMod').textContent='Sistema PKS';$('tituloMod').textContent='Acesso';$('subMod').hidden=true;$('trilha').innerHTML='Sistema PKS';desenhaMenu('home')}
async function iniciaAcesso(){
  const u=await (window.claude?.use?window.claude.use('user'):Promise.resolve(null)).catch(()=>null);S.userCap=u;
  let me=null;try{me=u?await u.me():null}catch{}
  const adm=!!(me&&(me.isOwner||me.canEdit));
  const db=await (window.claude?.use?window.claude.use('db'):Promise.resolve(null)).catch(()=>null);
  if(me?.id&&db)db.doc('pessoas/'+me.id).get().then(sn=>{S.nome=sn.exists?sn.data()?.nome||'':'';perfilUI();if(abaAtual()==='home')route()}).catch(()=>{});
  if(adm){S.acesso={pronto:true,adm:true,reg:null};S.perfil='Administrador';
    if(db){db.collection('usuarios').onSnapshot(sn=>{S.usuarios=sn.docs.map(d=>({id:d.id,...d.data()}));if(abaAtual()==='config')renderConfig()},()=>{});
      db.doc('config/setores').onSnapshot(sn=>{const l=sn.exists?sn.data()?.lista:null;S.setores=Array.isArray(l)?l:null;if(abaAtual()==='config')renderConfig()},()=>{});
      db.collection('pessoas').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>o[d.id]=d.data());S.nomes=o;if(abaAtual()==='config'&&!document.activeElement?.dataset?.unome)renderConfig()},()=>{});}}
  else if(me&&me.id&&db){db.doc('usuarios/'+me.id).onSnapshot(sn=>{const reg=sn.exists?sn.data():null;S.acesso={pronto:true,adm:false,reg};S.perfil=reg?.setor||'Sem acesso';perfilUI();route()},()=>{S.acesso={pronto:true,adm:false,reg:null};route()});}
  else{S.acesso={pronto:true,adm:false,reg:null};S.perfil='Sem acesso'}
  perfilUI();route()}
function perfilUI(){if(!S.perfil)return;const n=S.nome||S.perfil;$('perfilNome').textContent=n;$('perfilNome').nextElementSibling.textContent=S.nome?S.perfil:'Perfil de acesso';$('perfilIni').textContent=n.replace(/[^A-Za-zÀ-ú]/g,'').slice(0,2).toUpperCase()}
/* Configurações (pedido do Chai, 26/11/2026): Setores (o que cada setor acessa) e Usuários (nome, e-mail e setor).
   O acesso de cada pessoa continua gravado em usuarios/<id>.abas (é o que o banco e a função da Vaeso conferem): ao mudar o setor
   da pessoa ou as telas do setor, as abas das pessoas daquele setor são regravadas. Setores em config/setores, nomes em pessoas/<id>.
   No site, "Enviar convite" chama a função pks-convite: a pessoa recebe um link, abre o site e cria a senha. */
const GRUPOS_ABAS=()=>MODS.filter(m=>m[0]!=='config').map(([k,l,a])=>[l,a.filter(x=>x[0]!=='-'&&x[0]!=='estmov')]);
function setoresAtuais(){
  if(S.setores)return S.setores;
  const nomes=[...new Set([...SETORES,...S.usuarios.map(x=>x.setor).filter(Boolean)])];
  return nomes.map(nome=>({nome,abas:[...new Set(S.usuarios.filter(x=>x.setor===nome).flatMap(x=>x.abas||[]))]}));
}
const abasDoSetor=nome=>setoresAtuais().find(x=>x.nome===nome)?.abas||[];

    <p class="small muted">Marque as telas de cada setor. Quem está no setor passa a ver só essas telas. Administrador vê tudo.</p>`;

      h+=`<div class="cfg-user"><div class="cfg-top"><div class="cfg-nome"><b>${esc(st.nome)}</b><span class="small muted">${quantos(st.nome)} pessoa${quantos(st.nome)===1?'':'s'} · ${on.size} tela${on.size===1?'':'s'}</span></div>
        <button type="button" class="bt" data-setortudo="${esc(st.nome)}">Marcar tudo</button><button type="button" class="bt" data-setorrem="${esc(st.nome)}" ${quantos(st.nome)?'disabled title="Tire as pessoas do setor antes"':''}>Remover</button></div>
        <div class="cfg-abas">${GRUPOS_ABAS().map(([l,a])=>`<fieldset><legend>${esc(l)}</legend>${a.map(([k,n])=>`<label><input type="checkbox" data-setoraba="${esc(st.nome)}" value="${k}" ${on.has(k)?'checked':''}> ${esc(n)}</label>`).join('')}</fieldset>`).join('')}</div></div>`}
  }else{
    const optSet=v=>`<option value="">Sem setor</option>${ST.map(o=>`<option ${v===o.nome?'selected':''}>${esc(o.nome)}</option>`).join('')}`;
    h+=site?`<div class="cfg-add cfg-linha"><label class="campo"><span>Nome</span><input id="cfgNome" maxlength="60" autocomplete="off"></label><label class="campo cresce"><span>E-mail</span><input id="cfgEmail" type="email" autocomplete="off"></label>
      <label class="campo"><span>Setor</span><select id="cfgSetor">${optSet('')}</select></label><button type="button" class="bt bt-red" data-uconvida>Adicionar e enviar convite</button></div>
      <p class="small muted">A pessoa recebe um e-mail com um link, abre o Sistema PKS e cria a própria senha. "Reenviar convite" manda um link novo, também para quem esqueceu a senha.</p>`
      :`<div class="cfg-add"><label class="campo cresce"><span>Adicionar pessoa</span><input type="search" id="cfgBusca" placeholder="Nome ou e-mail de quem já tem acesso ao link" autocomplete="off"></label><div id="cfgRes" class="cfg-res"></div>
      <p class="small muted">A pessoa precisa primeiro receber o link pelo botão Compartilhar do Claude. Depois ela aparece nesta busca.</p></div>`;
    if(!U.length)h+='<div class="empty">Nenhuma pessoa cadastrada ainda.</div>';
    else h+=`<div class="scroll"><table class="compacto cfg-tab"><thead><tr><th>Nome</th><th>E-mail</th><th>Setor responsável</th><th>Acesso</th><th></th></tr></thead><tbody>${[...U].sort((a,b)=>COLL.compare(nomeDe(a)||emailDe(a),nomeDe(b)||emailDe(b))).map(x=>{const adm=x.admin;
      return `<tr><td><input class="cfg-in" data-unome="${esc(x.id)}" value="${esc(nomeDe(x))}" placeholder="Nome" maxlength="60" aria-label="Nome de ${esc(emailDe(x))}"></td><td class="small">${esc(emailDe(x)||ps[x.id]?.name||'')}</td>
        <td><select class="cfg-in" data-usetor="${esc(x.id)}" aria-label="Setor">${optSet(x.setor||'')}</select></td><td>${adm?'<span class="pill p-done">Administrador</span>':`<span class="small muted">${(x.abas||[]).length} tela${(x.abas||[]).length===1?'':'s'}</span>`}</td>
        <td class="cfg-acoes">${site?`<button type="button" class="bt" data-uconv="${esc(x.id)}">Reenviar convite</button>`:''}${adm?'':`<button type="button" class="bt" data-urem="${esc(x.id)}">Remover</button>`}</td></tr>`}).join('')}</tbody></table></div>`;
  }
  box.innerHTML=h;desenhaHits()}
function desenhaHits(){const r=$('cfgRes');if(!r)return;const ja=new Set(S.usuarios.map(x=>x.id));
  r.innerHTML=S.cfgHits.filter(x=>!ja.has(x.id)).slice(0,8).map(x=>`<button type="button" class="cfg-hit" data-uadd="${esc(x.id)}"><b>${esc(x.name)}</b> <span class="small muted">${esc(x.email||'')}</span></button>`).join('')}
async function salvaUsuario(id,patch,quieto){if(!S.db){toast('Sem conexão com a base.');return false}const atual={...(S.usuarios.find(x=>x.id===id)||{}),...patch,em:new Date().toISOString()};delete atual.id;
  try{await S.db.doc('usuarios/'+id).set(atual);if(!quieto)toast('Acesso salvo.');return true}catch{toast('Não foi possível salvar. Só o administrador altera usuários.');return false}}

/* ---------- Qive ---------- */
/* qiveStatus: notas que o Qive marcou como sincronizadas no ERP ou canceladas. qiveRodadas: resumo de cada leitura diária. */
function aplicaQive(){
  const sinc=new Set(),canc=new Set();
  for(const d of S.qiveStatus||[]){(d.sinc||[]).forEach(x=>sinc.add(x));(d.canc||[]).forEach(x=>canc.add(x))}
  S.notasTodas=(S.notasBrutas||[]).filter(n=>!n.arquivada).map(n=>({...n,sincErp:n.sincErp||sinc.has(n.seq),cancelada:n.cancelada||(canc.has(n.seq)?'qive':null)}));
  S.notas=S.notasTodas.filter(n=>n.status==='lancada'||(!n.foraDoImportador&&!n.sincErp&&!n.cancelada));
}
const ultimaRodada=()=>[...(S.qiveRodadas||[])].sort((a,b)=>String(b.em).localeCompare(String(a.em)))[0];

/* ---------- Natureza e CFOP ---------- */
/* Lançada: CFOP gravado no Protheus. Nota já aberta: cfopEntrada, o Cod.Fiscal lido no importador. Sem leitura: só o final previsto pela TES sugerida. */
function cfopInfo(n){
  const lanc=[...new Set((n.lancamento?.itens||[]).map(i=>i.cfop).filter(Boolean))];
  if(n.status==='lancada'&&lanc.length)return {v:lanc.join(', '),real:true,tit:'CFOP lançado no Protheus'};
  if(n.cfopEntrada?.length)return {v:[...new Set(n.cfopEntrada)].join(', '),real:true,tit:'CFOP de entrada lido no importador. Muda se a TES mudar.'};
  const su=n.sugestao?.sufixo;
  return su?{v:'x'+su,real:false,tit:'Final previsto pela TES sugerida. O primeiro dígito aparece quando a nota for aberta.'}:{v:'',real:false,tit:''};
}
const natCell=n=>n.natOp?`<span class="natop" title="${esc(n.natOp)}">${esc(n.natOp)}</span>`:'<span class="muted">–</span>';
function cfopCell(n){const c=cfopInfo(n);if(!c.v)return '<span class="muted">–</span>';return `<span class="mono ${c.real?'':'muted'}" title="${esc(c.tit)}">${esc(c.v)}</span>`}

/* ---------- Decisões sobre os pontos de atenção ---------- */
const KIND={tes:'TES',semhist:'Sem histórico',database:'Data-base',pedido:'Pedido',outro:'Outro ponto'};
const kindDe=t=>/usou \d+ TES/.test(t)?'tes':/sem histórico/i.test(t)?'semhist':/data-base/i.test(t)?'database':/pedido/i.test(t)?'pedido':'outro';
const pontosDe=n=>[...new Set((n.alertas||[]).filter(a=>a.n==='atencao').map(a=>kindDe(a.t)))];
/* Vale a decisão da nota; sem ela, a regra do fornecedor; sem ela, a regra geral. */
function decisaoDe(n,k){const o=n.decisoes?.[k];if(o)return {...o,fonte:'nota'};
  const f=n.forn&&S.regras[k+'__'+n.forn];if(f)return {...f,fonte:'forn'};
  const g=S.regras[k+'__todos'];return g?{...g,fonte:'todas'}:null}
const regraId=(n,k,esc)=>esc==='forn'&&n.forn?k+'__'+n.forn:esc==='todas'?k+'__todos':null;
async function salvaDec(seq,k,valor,escopo){
  const n=S.notas.find(x=>x.seq===seq);if(!n)return;
  if(!S.db){toast('Sem conexão com a base. A decisão não foi salva.');return}
  const antes=n.decisoes?.[k]||null;valor=String(valor||'').trim().slice(0,200);
  const esc=valor?(escopo||antes?.escopo||'nota'):null;const hoje=new Date().toISOString();
  try{
    await S.db.doc('notas/'+seq).update({decisoes:{...(n.decisoes||{}),[k]:valor?{valor,escopo:esc,em:hoje}:null}});
    const idA=antes?regraId(n,k,antes.escopo):null,idN=valor?regraId(n,k,esc):null;
    if(idA&&idA!==idN&&S.regras[idA]?.seq===seq)await S.db.doc('regras/'+idA).delete();
    if(idN)await S.db.doc('regras/'+idN).set({kind:k,forn:esc==='forn'?n.forn:null,nome:esc==='forn'?(n.nome||''):'',valor,escopo:esc,em:hoje,doc:n.doc,seq});
    toast(valor?(idN?'Decisão salva e aplicada nas próximas notas.':'Decisão salva nesta nota.'):'Decisão removida.');
  }catch{toast('A decisão não foi salva. Tente novamente.');renderNotas()}
}
function cellSeguir(n){
  const al=n.alertas||[];
  if(n.status==='lancada'){const v=pontosDe(n).map(k=>decisaoDe(n,k)?.valor).filter(Boolean);return v.length?`<span class="small">${esc(v.join('; '))}</span>`:'<span class="muted">–</span>'}
  if(al.some(a=>a.n==='bloqueio'))return '<span class="small muted">Resolver no Protheus</span>';
  const ks=pontosDe(n);if(!ks.length)return '<span class="muted">–</span>';
  return `<div class="decs">${ks.map(k=>{
    const d=decisaoDe(n,k),key=n.seq+'|'+k,attr=`data-seq="${esc(n.seq)}" data-k="${k}"`,rot=`${KIND[k]} da nota ${esc(n.doc)}`;
    const sg=n.sugestao,ops=k==='tes'&&sg?[...new Set([sg.tes,...(sg.alts||[])])]:[];
    const comSel=ops.length&&S.dEdit!==key&&(!d||ops.includes(d.valor));
    const ctrl=comSel
      ?`<select class="dec-sel ${d?'feita':''}" ${attr} aria-label="O que seguir: ${rot}"><option value="">Escolher…</option>${ops.map((o,i)=>`<option value="${esc(o)}" ${d?.valor===o?'selected':''}>TES ${esc(o)}${i===0?' (principal)':''}</option>`).join('')}<option value="__txt">Escrever…</option></select>`
      :`<input type="text" class="dec-txt ${d?'feita':''}" ${attr} maxlength="200" placeholder="O que seguir" value="${esc(S.dDraft[key]??d?.valor??'')}" aria-label="O que seguir: ${rot}">`;
    const baixo=d?.fonte==='nota'
      ?`<select class="esc dec-esc" ${attr} aria-label="Onde aplicar: ${rot}"><option value="nota" ${d.escopo==='nota'?'selected':''}>Só esta nota</option>${n.forn?`<option value="forn" ${d.escopo==='forn'?'selected':''}>Próximas deste fornecedor</option>`:''}<option value="todas" ${d.escopo==='todas'?'selected':''}>Todas com este ponto</option></select>`
      :d?`<span class="pill p-info">${d.fonte==='forn'?'Regra do fornecedor':'Regra geral'}</span>`:'';
    return `<div class="dec"><span class="small muted">${KIND[k]}</span>${ctrl}${baixo}</div>`}).join('')}</div>`;
}
function regrasBox(){
  const r=Object.entries(S.regras);if(!r.length)return '';

/* ---------- Períodos ---------- */
/* Só existe um corte: tudo até fechadoAte está fechado e tudo depois está aberto. */
const somaMes=(ym,d)=>{const y=+ym.slice(0,4),m=+ym.slice(5,7)-1+d,x=new Date(y,m,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
const fimMes=ym=>String(new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate()).padStart(2,'0')+'/'+ym.slice(5,7)+'/'+ym.slice(0,4);
const mesAberto=()=>S.periodos?.fechadoAte?somaMes(S.periodos.fechadoAte,1):null;
function lancarEm(n){
  if(n.status==='lancada')return n.competencia||null;
  const e=(n.emissao||'').slice(0,7),a=mesAberto();
  if(!e)return null;
  if(!a)return n.competencia||null;
  return e<a?a:e;
}
function renderPeriodo(){
  const box=$('perPanel');if(!box)return;box.hidden=!S.perOpen;if(!S.perOpen)return;
  const a=mesAberto();
  if(!a){box.innerHTML='<p class="small muted">Carregando os períodos…</p>';return}
  const f=S.periodos.fechadoAte,meses=[-2,-1,0,1,2,3].map(d=>somaMes(a,d));
  const movidas=S.notas.filter(n=>n.status!=='lancada'&&n.emissao&&n.emissao.slice(0,7)<a).length;
  box.innerHTML=`<div class="tools" style="justify-content:space-between"><h2>Período aberto: ${comp(a)}</h2><div class="tools"><button class="act" id="perReabrir">Reabrir ${comp(f)}</button><button class="act" id="perFechar">Fechar ${comp(a)}</button></div></div>
  <p class="small">Notas emitidas até ${fimMes(a)} são lançadas em ${comp(a)}, mesmo as de meses anteriores. Notas emitidas depois disso são lançadas no mês da emissão.${movidas?` Hoje, ${movidas} nota${movidas===1?'':'s'} não lançada${movidas===1?'':'s'} de meses fechados ${movidas===1?'entra':'entram'} em ${comp(a)}.`:''}</p>
  <div class="perlist">${meses.map(m=>`<span class="pill ${m<a?'p-open':'p-done'}">${comp(m)} ${m<a?'fechado':'aberto'}</span>`).join('')}</div>`;
}
async function mudaPeriodo(novo,msg){
  if(!S.db){toast('Sem conexão com a base. O período não foi alterado.');return}
  try{await S.db.doc('meta/periodos').set({fechadoAte:novo,atualizadoEm:new Date().toISOString()});toast(msg)}
  catch{toast('O período não foi alterado. Tente novamente.')}
}

/* Busca: todas as palavras digitadas precisam aparecer, em qualquer ordem. */
Object.defineProperty(String.prototype,'casa',{value:function(q){return String(q).split(/\s+/).filter(Boolean).every(w=>this.includes(w))},configurable:true});

/* ---------- Ordenação ---------- */
/* Cada coluna: [valor, começa do maior]. Texto começa de A a Z; número e data, do maior para o menor. */
const STATUS_ORD={em_aberto:'Em aberto',pronta:'Pronta para lançar',lancada:'Lançada'};
const SORT={
  notas:{status:[n=>STATUS_ORD[n.status]||n.status],tipo:[n=>n.tipo],doc:[n=>n.doc],nome:[n=>n.nome],natop:[n=>n.natOp],cfop:[n=>cfopInfo(n).v],emissao:[n=>n.emissao,1],comp:[n=>lancarEm(n),1],valor:[n=>+n.valorTotal,1],tes:[n=>n.sugestao?.tes],pontos:[n=>{const a=n.alertas||[];return a.some(x=>x.n==='bloqueio')?1000:a.filter(x=>x.n==='atencao'&&!decisaoDe(n,kindDe(x.t))).length},1],seguir:[n=>pontosDe(n).map(k=>decisaoDe(n,k)?.valor).filter(Boolean).join('; ')]},
  plat:{doc:[n=>n.doc],nome:[n=>n.nome],natop:[n=>n.natOp],cfop:[n=>cfopInfo(n).v],emissao:[n=>n.emissao,1],data:[n=>n.lancamento?.data,1],valor:[n=>+n.valorTotal,1],tes:[n=>[...new Set((n.lancamento?.itens||[]).map(i=>i.tes).filter(Boolean))].join(', ')],tempo:[n=>n.tempoSeg>0?n.tempoSeg:null,1]},
  hist:{doc:[n=>n.d],forn:[n=>fName(n.f)],tipo:[n=>TIPO[n.t]||n.t],emissao:[n=>n.e,1],dig:[n=>n.g,1],itens:[n=>n.i.length,1],total:[n=>+n.v,1],tes:[n=>[...new Set(n.i.map(i=>i[7]))].join(', ')],um:[n=>[...new Set(n.i.map(i=>i[3]))].join(', ')],ret:[n=>Object.keys(n.r).map(x=>RET[x]).join(', ')]},
  ent:{doc:[n=>n.doc],nome:[n=>n.nome],emissao:[n=>n.emissao,1],natop:[n=>n.natOp],valor:[n=>+n.valorTotal,1],itens:[n=>itensDe(n).length||null,1],st:[n=>({aberto:1,recebida:2,lancada:3})[entradaDe(n)]]},
  tes:{tes:[t=>t.tes],desc:[t=>t.desc],cfop:[t=>t.cfops.join(', ')],tipo:[t=>t.tipo.map(x=>TIPO[x]||x).join(', ')],linhas:[t=>t.linhas,1],pedido:[t=>t.pedido,1],icms:[t=>t.icms,1],ipi:[t=>t.ipi,1],cc:[t=>t.cc,1],arm:[t=>t.arm.join(', ')]},
  forn:{nome:[f=>f.nome],notas:[f=>f.notas,1],linhas:[f=>f.linhas,1],tes:[f=>f.tes.map(t=>t[0]).join(', ')],conf:[f=>f.conf,1],ped:[f=>f.ped,1],cc:[f=>f.cc[0]?.[0]],conta:[f=>f.conta[0]?.[0]],ret:[f=>f.ret.map(x=>RET[x]).join(', ')]}
};
const COLL=new Intl.Collator('pt-BR',{numeric:true,sensitivity:'base'});
const vazio=v=>v===null||v===undefined||v===''||(typeof v==='number'&&Number.isNaN(v));
function ordenar(t,list){const st=S.sort[t];if(!st)return list;const fn=SORT[t][st.k][0],sg=st.desc?-1:1;
  return list.map(x=>[fn(x),x]).sort(([a],[b])=>{const va=vazio(a),vb=vazio(b);if(va||vb)return va===vb?0:va?1:-1;
    return sg*(typeof a==='number'&&typeof b==='number'?a-b:COLL.compare(String(a),String(b)))}).map(p=>p[1])}
function th(t,k,l,cls){const st=S.sort[t],on=st?.k===k;
  return `<th${cls?` class="${cls}"`:''}${on?` aria-sort="${st.desc?'descending':'ascending'}"`:''}><button type="button" class="sort" data-st="${t}" data-sk="${k}" title="Ordenar por ${l}">${l}<i aria-hidden="true">${on?(st.desc?'▼':'▲'):'↕'}</i></button></th>`}
function clicaSort(t,k){const st=S.sort[t];S.sort[t]=st?.k===k?{k,desc:!st.desc}:{k,desc:!!SORT[t][k][1]};
  ({notas:renderNotas,plat:renderLancadas,hist:renderLancadas,tes:renderPadrao,forn:renderPadrao,ent:renderEntrada})[t]();
  document.querySelector(`button.sort[data-st="${t}"][data-sk="${k}"]`)?.focus()}

function fmtTempo(seg){if(!(seg>0))return '–';seg=Math.round(seg);const h=Math.floor(seg/3600),m=Math.floor(seg%3600/60),s=seg%60;return h?`${h}h${String(m).padStart(2,'0')}`:`${m}m${String(s).padStart(2,'0')}`}
function tempoBox(pl){

 direto no documento de entrada.'],['Bolinha verde','No importador, indica nota para lançamento.'],['Fidelidade ao XML','TES, UM e financeiro devem seguir o XML. Toda nota lançada entra no comparativo.'],['Quando parar','Lançar as notas marcadas como prontas sem perguntar a cada passo. Parar e perguntar só diante de algo novo.']];
  const hist=[['Escolha da TES',`Fornecedor + produto, depois produto, depois fornecedor. Sem correspondência, a nota fica sem sugestão.`],['CFOP','A TES define os três últimos dígitos, sem exceção no histórico. O primeiro vem da origem: 1 para o mesmo estado, 2 para outro estado.'],['UM e armazém',`Seguem o produto: mesma UM em ${String(m.umProduto).replace('.',',')}% das linhas e mesmo armazém em ${String(m.armProduto).replace('.',',')}%.`],['Identificação da nota','Sempre por emitente + documento + série. O número sozinho se repete entre emitentes.'],['Mês de lançamento',`${m.mesmoMes} de ${m.notas} notas foram digitadas no mês da emissão, ${m.mesSeguinte} no mês seguinte e ${m.doisMeses} dois meses depois.`]];
  let h=regrasBox()+`<div class="section"><h2>Regras gerais</h2><div class="rules">${you.map(([t,x])=>`<div class="rule"><span class="src you">Você definiu</span><h3>${t}</h3><p>${x}</p></div>`).join('')}${hist.map(([t,x])=>`<div class="rule"><span class="src">Visto no histórico</span><h3>${t}</h3><p>${x}</p></div>`).join('')}</div></div>`;
  h+=`<div class="section"><h2>Quanto o padrão acerta</h2><p>Treinei o padrão com as linhas digitadas até ${dt(H.corte)} e usei-o para prever a TES das ${H.linhas} linhas seguintes: <b>${H.acertos} acertos (${pct}%)</b>. Por isso, a TES é uma sugestão que você confere, nunca uma decisão automática.</p>
  <div class="scroll"><table><thead><tr><th>Regra usada</th><th class="num">Linhas</th><th class="num">Acertos</th><th class="num">Taxa</th></tr></thead><tbody><tr><td>Fornecedor + produto</td><td class="num">${H.parN}</td><td class="num">${H.parOk}</td><td class="num">${Math.round(H.parOk/H.parN*100)}%</td></tr><tr><td>Só produto (fornecedor novo para o item)</td><td class="num">${H.prodN}</td><td class="num">${H.prodOk}</td><td class="num">${Math.round(H.prodOk/H.prodN*100)}%</td></tr><tr><td>Só fornecedor (produto novo)</td><td class="num">${H.fornN}</td><td class="num">${H.fornOk}</td><td class="num">${Math.round(H.fornOk/H.fornN*100)}%</td></tr><tr><td>Sem sugestão</td><td class="num">${H.semSugestao}</td><td class="num">–</td><td class="num">–</td></tr></tbody></table></div></div>`;
  h+=`<div class="section"><h2>Decisões que faltam</h2><ol class="decide"><li><b>Unidades que não são peça nem peso:</b> o histórico tem LT, MT, FD, CX, CT e GL em 142 linhas, nenhuma em produto iniciado em 90. Litro e metro continuam como estão? Fardo e caixa viram unidade?</li><li><b>Notas de novembro:</b> posso trocar a data-base da sessão para novembro ao lançar essas notas? Em qual data?</li><li><b>Dados que faltam:</b> o CSV não traz natureza e condição (SF1), títulos (SE2), nomes de fornecedores (SA2) nem a descrição das TES (SF4). Exportar essas tabelas completa o padrão e a aba Lançadas.</li></ol></div>`;

  const q=S.fq;const fl=P.fornecedores.filter(f=>!q||(f.f+' '+f.nome+' '+f.pares.map(p=>p.p+' '+p.d).join(' ')+' '+f.tes.map(t=>t[0]).join(' ')).toLowerCase().casa(q)).sort((a,b)=>b.linhas-a.linhas);
  h+=`<div class="section"><h2>Padrão por fornecedor e produto</h2><div class="tools"><input type="search" id="fq" placeholder="Fornecedor, produto ou TES" value="${esc(S.fqRaw??S.fq)}" aria-label="Buscar no padrão"><span class="small muted">${fl.length} fornecedores</span></div><div class="scroll"><table><thead><tr>${th('forn','nome','Fornecedor')}${th('forn','notas','Notas','num')}${th('forn','linhas','Linhas','num')}${th('forn','tes','TES')}${th('forn','conf','Na TES principal','num')}${th('forn','ped','Com pedido','num')}${th('forn','cc','CC principal')}${th('forn','conta','Conta principal')}${th('forn','ret','Retenções')}</tr></thead><tbody>`;
  for(const f of ordenar('forn',fl).slice(0,S.fLim)){h+=`<tr class="row" data-fopen="${esc(f.f)}" tabindex="0" aria-expanded="${S.fOpen.has(f.f)}"><td><span class="mono">${esc(f.f)}</span> <span class="small">${esc(f.nome)}</span></td><td class="num">${f.notas}</td><td class="num">${f.linhas}</td><td class="mono">${f.tes.map(t=>esc(t[0])).join(', ')}</td><td class="num"><span class="pill ${f.conf>=90?'p-done':'p-warn'}">${f.conf}%</span></td><td class="num">${f.ped}%</td><td class="mono">${esc(f.cc[0]?.[0]||'')}</td><td class="mono">${esc(f.conta[0]?.[0]||'')}</td><td>${f.ret.map(x=>RET[x]).join(', ')}</td></tr>`;
    if(S.fOpen.has(f.f))h+=`<tr><td colspan="9" class="detail"><div class="inner"><table><thead><tr><th>Produto</th><th>UM</th><th class="num">Linhas</th><th>TES (vezes)</th><th>CFOP</th><th>CC</th><th>Conta</th><th>Arm.</th></tr></thead><tbody>${f.pares.map(p=>`<tr><td class="mono">${esc(p.p)}<div class="muted small">${esc(p.d)}</div></td><td>${esc(p.um)}</td><td class="num">${p.n}</td><td class="mono">${p.tes.map(t=>esc(t[0])+' ('+t[1]+')').join(', ')}</td><td class="mono">${esc(p.cf)}</td><td class="mono">${esc(p.cc)}</td><td class="mono">${esc(p.ct)}</td><td class="mono">${esc(p.a)}</td></tr>`).join('')}</tbody></table></div></td></tr>`}
  if(!fl.length)h+='<tr><td colspan="9" class="empty">Nenhum fornecedor com esse filtro.</td></tr>';

function renderAll(){renderNotas();renderEntrada();renderLancadas();renderPadrao();route()}
document.addEventListener('change',async e=>{const t=e.target,sq=t.dataset?.seq,k=t.dataset?.k;if(!sq||!k)return;
  if(t.matches('.dec-sel')){if(t.value==='__txt'){S.dEdit=sq+'|'+k;renderNotas();return}await salvaDec(sq,k,t.value)}
  else if(t.matches('.dec-esc')){const n=S.notas.find(x=>x.seq===sq);await salvaDec(sq,k,n?.decisoes?.[k]?.valor,t.value)}
  else if(t.matches('.dec-txt')){const key=sq+'|'+k;delete S.dDraft[key];if(S.dEdit===key)S.dEdit=null;await salvaDec(sq,k,t.value)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches?.('.dec-txt'))e.target.blur()});
document.addEventListener('keydown',e=>{const pm=$('polMenu');
  if(pm&&!pm.hidden){if(e.key==='Escape'){e.preventDefault();fechaMenu(true)}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const it=[...pm.querySelectorAll('button')],i=it.indexOf(document.activeElement);it[(i+(e.key==='ArrowDown'?1:-1)+it.length)%it.length].focus()}
    return}
  if(e.key==='Escape'&&S.polChamado){S.polChamado=false;S.polModo='normal';renderPolenta();$('polChamar')?.focus()}});
document.addEventListener('change',async e=>{if(e.target.id!=='minManual')return;
  const v=Math.max(0,Math.round(+e.target.value||0));if(!S.db){toast('Sem conexão com a base. Não foi possível salvar.');return}

});
document.addEventListener('change',async e=>{const t=e.target;if(!t.matches('select.st'))return;
  const seq=t.dataset.seq,v=t.value;
  const n=S.notas.find(x=>x.seq===seq);
  if(!S.db){toast('Não foi possível salvar nesta visualização.');renderNotas();return}

  try{await S.db.doc('notas/'+seq).update({status:v,statusEm:new Date().toISOString()});toast(v==='pronta'?`Nota ${n?.doc} marcada como pronta.`:`Nota ${n?.doc} voltou para em aberto.`)}
  catch(err){toast('O status não foi salvo. Tente novamente.');renderNotas()}
});
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.closest('select,input'))return;
  const et=t.closest('[data-et]');if(et){S.eTipo=et.dataset.et;renderEntrada();return}
  const es=t.closest('[data-es]');if(es){S.eSt=es.dataset.es;renderEntrada();return}
  const so=t.closest('button.sort');if(so){clicaSort(so.dataset.st,so.dataset.sk);return}
  const f=t.closest('[data-f]');if(f){S.fStatus=f.dataset.f;renderNotas();return}
  const ht=t.closest('[data-ht]');if(ht){S.hTipo=ht.dataset.ht;S.hLim=40;renderLancadas();return}
  if(t.closest('#perBtn')){S.perOpen=!S.perOpen;counts();renderPeriodo();$('perBtn')?.focus();return}
  if(t.id==='perFechar'){const a=mesAberto();if(a)await mudaPeriodo(a,`${comp(a)} fechado. O período aberto agora é ${comp(somaMes(a,1))}.`);return}
  if(t.id==='perReabrir'){const f=S.periodos?.fechadoAte;if(f)await mudaPeriodo(somaMes(f,-1),`${comp(f)} reaberto.`);return}
  const rd=t.closest('[data-rdel]');if(rd){try{await S.db.doc('regras/'+rd.dataset.rdel).delete();toast('Regra removida.')}catch{toast('A regra não foi removida. Tente novamente.')}return}
  if(t.id==='hMore'){S.hLim+=40;renderLancadas();return}
  if(t.id==='fMore'){S.fLim+=30;renderPadrao();return}
  if(t.id==='copyBaixa'){try{await navigator.clipboard.writeText(S.baixaTxt||'');toast('Lista copiada.')}catch{toast('Não foi possível copiar. Selecione a tabela e copie.')}return}
  if(t.id==='copyCmd'){try{await navigator.clipboard.writeText('Polenta, lançar as notas prontas');toast('Pedido copiado.')}catch{toast('Copie o texto: Polenta, lançar as notas prontas')}return}
  toggleRow(t.closest('tr.row'));
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.row')){e.preventDefault();toggleRow(e.target)}});
function toggleRow(r){if(!r)return;
  if(r.dataset.open){const k=r.dataset.open;(()=>{const x=S.open.has(k);S.open.clear();if(!x)S.open.add(k)})();renderNotas()}
  else if(r.dataset.hopen){const k=r.dataset.hopen;(()=>{const x=S.hOpen.has(k);S.hOpen.clear();if(!x)S.hOpen.add(k)})();renderLancadas()}
  else if(r.dataset.eopen){const k=r.dataset.eopen;(()=>{const x=S.eOpen.has(k);S.eOpen.clear();if(!x)S.eOpen.add(k)})();renderEntrada()}
  else if(r.dataset.popen){const k=r.dataset.popen;(()=>{const x=S.pOpen.has(k);S.pOpen.clear();if(!x)S.pOpen.add(k)})();renderLancadas()}
  else if(r.dataset.fopen){const k=r.dataset.fopen;(()=>{const x=S.fOpen.has(k);S.fOpen.clear();if(!x)S.fOpen.add(k)})();renderPadrao()}
}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.qRaw=t.value;S.q=t.value.trim().toLowerCase();S.qFocus=true;renderNotas()}
  if(t.id==='hq'){S.hqRaw=t.value;S.hq=t.value.trim().toLowerCase();S.hFocus=true;S.hLim=40;renderLancadas()}
  if(t.id==='fq'){S.fqRaw=t.value;S.fq=t.value.trim().toLowerCase();S.fFocus=true;S.fLim=30;renderPadrao()}
  if(t.id==='eq'){S.eqRaw=t.value;S.eq=t.value.trim().toLowerCase();renderEntrada()}
  if(t.matches('.dec-txt')){const key=t.dataset.seq+'|'+t.dataset.k;S.dDraft[key]=t.value;S.dEdit=key}
});
document.addEventListener('focusout',e=>{if(e.target.matches?.('.dec-txt')){const key=e.target.dataset.seq+'|'+e.target.dataset.k;if(S.dEdit===key&&S.dDraft[key]===undefined)S.dEdit=null}if(e.target.id==='q')S.qFocus=false;if(e.target.id==='hq')S.hFocus=false;if(e.target.id==='fq')S.fFocus=false});


/* ---------- Mascote ---------- */
/* meta/polenta: {estado:'trabalhando'|'concluido'|'parado', texto, atual, total, em}. Sem sinal há 30 minutos, some. */
function renderPolenta(){
  const el=$('pol');if(!el)return;const m=S.polenta;const idade=m?.em?Date.now()-Date.parse(m.em):Infinity;
  const ativo=!!(m&&((m.estado==='trabalhando'&&idade<30*60e3)||(m.estado==='concluido'&&idade<3*60e3)));
  const bt=$('polChamar');if(bt)bt.setAttribute('aria-pressed',String(!!S.polChamado));
  const ver=ativo||!!S.polChamado;
  el.hidden=!ver;document.body.classList.toggle('pol-on',ver);if(!ver)return;
  el.classList.toggle('min',!!S.polMin);
  el.classList.toggle('estudo',S.polModo==='estudo');
  if(S.polModo==='estudo'){$('polTxt').innerHTML=S.polAnalise||'<b>Analisando as notas…</b>Folheando o importador, as regras e o histórico.';return}
  if(ativo&&!S.polChamado){
    const prog=m.estado==='trabalhando'&&m.total>0?`<span class="muted small">Nota ${m.atual||1} de ${m.total}</span>`:'';
    $('polTxt').innerHTML=`<b>${m.estado==='concluido'?'Pronto!':'Polenta trabalhando'}</b>${esc(m.texto||'')}${prog?'<br>'+prog:''}`;
    return;
  }
  /* Novidades da aba aberta (26/11/2026), em tom animado; nas telas do lançador continua o resumo das notas */
  const aba=abaAtual();
  if(!['notas','entrada','lancadas','padrao'].includes(aba)&&window.MOD?.novidades){
    const nv=window.MOD.novidades(aba),k=nv.length?(S.polIdx||0)%nv.length:0,x=nv[k];
    const nomeAba=MODS.flatMap(m=>m[2]).find(a=>a[0]===aba)?.[1]||'';
    $('polTxt').innerHTML=!x?`<b>Oi! Estou por aqui.</b>Por enquanto nada de novo em ${esc(nomeAba)}. Quando acontecer algo, eu conto!`
      :`<b>${['Ei, novidade!','Olha só!','Fiquei sabendo!','Adivinha?'][k%4]}</b>${esc(x.t)}${x.mais&&!S.polMais&&x.pergunta?'<br>'+esc(x.pergunta):''}
      ${S.polMais&&x.mais?`<ul class="pol-lista">${x.mais.slice(0,12).map(l=>`<li>${esc(l)}</li>`).join('')}${x.mais.length>12?`<li class="muted">e mais ${x.mais.length-12}</li>`:''}</ul>`:''}
      <div class="acoes">${x.mais&&!S.polMais?'<button type="button" id="polMais">Quero saber!</button>':''}${nv.length>1?`<button type="button" id="polOutra">Outra novidade${nv.length>1?` (${k+1}/${nv.length})`:''}</button>`:''}</div>`;
    return;
  }
  const pr=S.notas.filter(n=>n.status==='pronta'),tot=pr.reduce((a,n)=>a+(+n.valorTotal||0),0);
  const pend=S.notas.filter(n=>n.status!=='lancada'&&pontosDe(n).some(k=>!decisaoDe(n,k))).length;
  const linhas=[];
  if(ativo)linhas.push(`${m.estado==='concluido'?'Acabei agora':'Agora estou'}: ${esc(m.texto||'')}`);
  linhas.push(pr.length?`${pr.length} nota${pr.length===1?' pronta':'s prontas'} para lançar, R$ ${money(tot)}.`:'Nenhuma nota pronta para lançar.');
  if(pend)linhas.push(`${pend} nota${pend===1?' tem ponto':'s têm pontos'} de atenção sem decisão.`);
  if(mesAberto())linhas.push(`Período aberto: ${comp(mesAberto())}.`);
  linhas.push(pr.length?'Para eu lançar, peça no chat: <b style="display:inline;font:inherit;font-weight:600">“Polenta, lançar as notas prontas”</b>.':'Marque notas como prontas e me chame no chat.');
  $('polTxt').innerHTML=`<b>Oi! Estou por aqui.</b>${linhas.join('<br>')}<div class="acoes">${pr.length?'<button type="button" id="polCopy">Copiar o pedido</button>':''}<button type="button" id="polAnalisar">Analisar</button></div>`;
}
function polAnim(cls,ms){const el=$('pol');if(!el)return;
  el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);clearTimeout(polAnim[cls]);polAnim[cls]=setTimeout(()=>el.classList.remove(cls),ms)}
function analiseNotas(){
  const ab=S.notas.filter(n=>n.status!=='lancada'),a=mesAberto(),pr=ab.filter(n=>n.status==='pronta').length;
  const cont={};ab.forEach(n=>pontosDe(n).forEach(k=>{if(!decisaoDe(n,k))cont[k]=(cont[k]||0)+1}));
  const bloq=ab.filter(n=>(n.alertas||[]).some(x=>x.n==='bloqueio')).length;
  const fech=a?ab.filter(n=>n.emissao&&n.emissao.slice(0,7)<a).length:0;
  const dep=a?ab.filter(n=>{const l=lancarEm(n);return l&&l>a}).length:0;
  const semSug=ab.filter(n=>!n.sugestao&&!decisaoDe(n,'tes')&&!(n.alertas||[]).some(x=>x.n==='bloqueio')).length;
  const mai=[...ab].sort((x,y)=>(+y.valorTotal||0)-(+x.valorTotal||0))[0];
  const L=[`${ab.length} nota${ab.length===1?'':'s'} em aberto${pr?`, ${pr} pronta${pr===1?'':'s'}`:''}.`];
  const pts=Object.entries(cont).map(([k,v])=>`${KIND[k]} ${v}`).join(', ');if(pts)L.push(`Pontos sem decisão: ${pts}.`);
  if(bloq)L.push(`${bloq} com bloqueio, a resolver no Protheus.`);
  if(fech)L.push(`${fech} de meses fechados ${fech===1?'entra':'entram'} em ${comp(a)}.`);
  if(dep)L.push(`${dep} ${dep===1?'fica':'ficam'} para depois de ${comp(a)}.`);
  if(semSug)L.push(`${semSug} sem TES sugerida nem decisão.`);
  if(mai)L.push(`Maior valor em aberto: R$ ${money(mai.valorTotal)}, ${esc(mai.nome||'')} (${esc(mai.doc)}).`);
  return `<b>Análise das notas</b>${L.join('<br>')}<div class="acoes"><button type="button" id="polVolta">Voltar</button></div>`;
}
function polAnalisar(){S.polChamado=true;S.polMin=false;S.polModo='estudo';S.polAnalise=null;renderPolenta();
  clearTimeout(S.polT);S.polT=setTimeout(()=>{if(S.polModo==='estudo'){S.polAnalise=analiseNotas();renderPolenta()}},2600)}
function abreMenu(x,y){const m=$('polMenu'),b=$('polBtn');if(!m||!b)return;m.hidden=false;const r=b.getBoundingClientRect();
  if(!x&&!y){x=r.left;y=r.top}const w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(x-w/2,innerWidth-w-8))+'px';m.style.top=Math.max(8,Math.min(y-h-6,innerHeight-h-8))+'px';m.querySelector('button').focus()}
function fechaMenu(foco){const m=$('polMenu');if(!m||m.hidden)return;m.hidden=true;if(foco)$('polBtn')?.focus()}
document.addEventListener('contextmenu',e=>{if(!e.target.closest('#polBtn'))return;e.preventDefault();abreMenu(e.clientX,e.clientY)});
document.addEventListener('focusin',e=>{if(!e.target.closest('#polMenu'))fechaMenu(false)});
document.addEventListener('click',async e=>{
  if(!e.target.closest('#polMenu'))fechaMenu(false);
  const pi=e.target.closest('[data-pol]');
  if(pi){fechaMenu(true);const a=pi.dataset.pol;
    if(a==='analisar')polAnalisar();
    else if(a==='dancar'){S.polModo='normal';renderPolenta();polAnim('danca',1800)}
    else{S.polChamado=false;S.polModo='normal';S.polMin=true;renderPolenta();$('polChamar')?.focus()}
    return}
  if(e.target.closest('#polChamar')){S.polChamado=!S.polChamado;S.polMin=false;S.polIdx=0;S.polMais=false;S.polModo='normal';renderPolenta();if(S.polChamado)polAnim('chega',1400);return}
  if(e.target.closest('#polAnalisar')){polAnalisar();return}
  if(e.target.closest('#polMais')){S.polMais=true;renderPolenta();return}
  if(e.target.closest('#polOutra')){S.polIdx=(S.polIdx||0)+1;S.polMais=false;renderPolenta();return}
  if(e.target.closest('#polVolta')){S.polModo='normal';renderPolenta();return}
  if(e.target.closest('#polCopy')){try{await navigator.clipboard.writeText('Polenta, lançar as notas prontas');toast('Pedido copiado.')}catch{toast('Copie o texto: Polenta, lançar as notas prontas')}return}
  if(e.target.closest('#polMin')){S.polModo='normal';if(S.polChamado){S.polChamado=false;$('polChamar')?.focus()}else S.polMin=true;renderPolenta();return}
  if(e.target.closest('#polBtn')){S.polMin=!S.polMin;renderPolenta();if(S.polModo!=='estudo')polAnim('danca',1800);return}
});
setInterval(renderPolenta,60e3);


/* ---------- Entrada de Notas ---------- */
/* Status do recebimento, separado do status de lançamento: aberto, recebida, lancada. Nota lançada pelo Polenta já conta como lançada. */
const ENT={aberto:'Em aberto',recebida:'Recebida',lancada:'Lançada'};
const TIPOS_ENT=['NF-e','NFS-e','CT-e'];
const entradaDe=n=>n.status==='lancada'||n.sincErp?'lancada':(ENT[n.entrada?.status]?n.entrada.status:'aberto');
function itensDe(n){
  if(n.itens?.length)return n.itens.map(i=>({xml:i.xml,xmlDesc:i.xmlDesc,prod:i.tela?.prod||i.sug?.prod||'',desc:i.tela?.desc||i.sug?.desc||'',q:i.qXml,um:i.umXml,unit:i.unitXml,total:i.total,ncm:i.ncm,cfopXml:i.cfopXml||'',tes:i.tela?.tes||'',cfop:i.tela?.cfop||''}));
  return (n.lancamento?.itens||[]).filter(i=>i.prod||i.desc).map(i=>({xml:'',xmlDesc:'',prod:i.prod,desc:i.desc,q:i.q,um:i.um,unit:i.unit,total:i.total,ncm:'',tes:i.tes,cfop:i.cfop}));
}
function entDetalhe(n){
  const it=itensDe(n);
  if(n.nfsVinculadas?.length&&!it.length)return `<div class="inner"><table><thead><tr><th>NF de saída vinculada ao CT-e</th><th>Série</th><th>Cliente</th></tr></thead><tbody>${n.nfsVinculadas.map(v=>`<tr><td class="mono">${esc(v.num)}</td><td>${esc(v.serie)}</td><td class="mono">${esc(v.cliente)}</td></tr>`).join('')}</tbody></table></div>`;
  if(!it.length)return '<p class="small muted">Os produtos desta nota ainda não foram lidos. O Polenta lê os produtos quando abre a nota no importador.</p>';
  return `<div class="inner"><table><thead><tr><th>Item no XML</th><th>Produto</th><th class="num">Qtde.</th><th>UM</th><th class="num">Unit.</th><th class="num">Total</th><th>NCM</th><th>CFOP do XML</th><th>TES / CFOP</th></tr></thead><tbody>${it.map(i=>`<tr><td>${i.xml?`<span class="mono">${esc(i.xml)}</span>`:''}<div class="muted small">${esc(i.xmlDesc||'')}</div></td><td class="mono">${esc(i.prod)}<div class="muted small">${esc(i.desc)}</div></td><td class="num">${qty(i.q)}</td><td>${esc(i.um||'')}</td><td class="num">${qty(i.unit)}</td><td class="num">${money(i.total)}</td><td class="mono">${esc(i.ncm||'')}</td><td class="mono">${esc(i.cfopXml||'')}</td><td class="mono">${esc([i.tes,i.cfop].filter(Boolean).join(' / '))}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderEntrada(){
  const box=$('v-entrada');if(!box)return;
  if(S.dbState==='loading'&&!S.notas.length){box.innerHTML='<div class="empty">Carregando as notas do importador…</div>';return}
  if(S.dbState==='off'){box.innerHTML='<div class="empty">Não foi possível acessar as notas nesta visualização. Abra a página com sua conta do Claude.</div>';return}
  const TODAS=S.notasTodas||S.notas;const doTipo=TODAS.filter(n=>n.tipo===S.eTipo);
  const cont=t=>TODAS.filter(n=>n.tipo===t).length;
  const cst=k=>doTipo.filter(n=>k==='todas'||entradaDe(n)===k).length;
  const q=S.eq;const list=doTipo.filter(n=>(S.eSt==='todas'||entradaDe(n)===S.eSt)&&(!q||[n.doc,n.nome,n.forn,n.natOp,n.serie].join(' ').toLowerCase().casa(q)));
  let h=`<div class="tools" style="justify-content:space-between"><div><h2>Entrada de Notas Fiscais</h2></div></div>
  <nav class="tabs" aria-label="Tipo de documento">${TIPOS_ENT.map(t=>`<a href="#entrada" data-et="${t}" ${S.eTipo===t?'aria-current="page"':''}>${t} <span class="muted small">${cont(t)}</span></a>`).join('')}</nav>
  <div class="tools"><div class="seg" role="group" aria-label="Filtrar por status de entrada">${[['todas','Todas'],['aberto','Em aberto'],['recebida','Recebidas'],['lancada','Lançadas']].map(([k,l])=>`<button data-es="${k}" aria-pressed="${S.eSt===k}">${l} <span class="small">${cst(k)}</span></button>`).join('')}</div><input type="search" id="eq" placeholder="Documento, emitente ou natureza" value="${esc(S.eqRaw??'')}" aria-label="Buscar na entrada de notas"></div>
  <div class="scroll"><table><thead><tr>${th('ent','doc','Documento')}${th('ent','nome','Emitente')}${th('ent','emissao','Emissão')}${th('ent','natop','Natureza da operação')}${th('ent','valor','Valor','num')}${th('ent','itens','Itens','num')}${th('ent','st','Status','stcol')}</tr></thead><tbody>`;
  if(!list.length)h+=`<tr><td colspan="7" class="empty">${doTipo.length?'Nenhuma nota com esse filtro.':'Nenhuma '+esc(S.eTipo)+' no importador.'}</td></tr>`;
  for(const n of ordenar('ent',list)){
    const st=entradaDe(n),it=itensDe(n).length,auto=n.status==='lancada'||n.sincErp;
    const ctrl=auto?`<span class="pill p-done" title="Lançada pelo Polenta">Lançada</span>`:`<select class="ent" data-seq="${esc(n.seq)}" data-v="${st}" aria-label="Status de entrada da nota ${esc(n.doc)}">${Object.entries(ENT).map(([k,l])=>`<option value="${k}" ${st===k?'selected':''}>${l}</option>`).join('')}</select>`;
    h+=`<tr class="row" data-eopen="${esc(n.seq)}" tabindex="0" aria-expanded="${S.eOpen.has(n.seq)}"><td class="mono">${esc(n.doc)}${n.serie?' / '+esc(n.serie):''}${n.sincErp&&n.status!=='lancada'?`<div><span class="pill p-done" title="O Qive mostra esta nota como sincronizada no ERP">No ERP</span></div>`:''}${n.cancelada?`<div><span class="pill p-stop">Cancelada</span></div>`:''}${n.foraDoImportador&&n.status!=='lancada'?`<div><span class="pill p-open" title="Não estava mais no importador em ${dt(n.foraDoImportador)}">Saiu do importador</span></div>`:''}</td><td class="name">${esc(n.nome)}</td><td>${dt(n.emissao)}</td><td>${natCell(n)}</td><td class="num">${money(n.valorTotal)}</td><td class="num">${it||'<span class="muted">–</span>'}</td><td class="stcol">${ctrl}</td></tr>`;
    if(S.eOpen.has(n.seq))h+=`<tr><td colspan="7" class="detail">${entDetalhe(n)}</td></tr>`;
  }
  box.innerHTML=h+'</tbody></table></div>';
}
document.addEventListener('change',async e=>{const t=e.target;if(!t.matches('select.ent'))return;
  const seq=t.dataset.seq,v=t.value,n=(S.notasTodas||S.notas).find(x=>x.seq===seq);
  if(!S.db){toast('Sem conexão com a base. O status não foi salvo.');renderEntrada();return}
  try{await S.db.doc('notas/'+seq).update({entrada:{status:v,em:new Date().toISOString()}});toast(`Nota ${n?.doc||''}: ${ENT[v]}.`)}
  catch{toast('O status não foi salvo. Tente novamente.');renderEntrada()}
});
/* Mantém o foco e a posição do cursor nos campos de busca quando a tela é redesenhada. */
function comFoco(fn){return function(...a){const ae=document.activeElement,id=ae&&ae.id&&ae.matches?.('input,textarea')?ae.id:null,ss=id?ae.selectionStart:0,se=id?ae.selectionEnd:0;
  const r=fn.apply(this,a);
  if(id){const nv=document.getElementById(id);if(nv&&nv!==ae&&document.activeElement!==nv){nv.focus();try{nv.setSelectionRange(ss,se)}catch{}}}
  return r}}
renderNotas=comFoco(renderNotas);renderEntrada=comFoco(renderEntrada);renderLancadas=comFoco(renderLancadas);renderPadrao=comFoco(renderPadrao);

/* ---------- Dados ---------- */
async function loadFiles(){
  try{S.padrao=await (await fetch('padrao.json')).json();renderPadrao();renderLancadas();renderNotas()}catch{$('v-padrao').innerHTML='<div class="empty">Não foi possível carregar o padrão. Recarregue a página.</div>'}
  try{S.hist=await (await fetch('historico.json')).json();renderLancadas()}catch{S.hist=[];}
}
iniciaAcesso();
async function loadDb(){
  const db=await (window.claude?.use?window.claude.use('db'):Promise.resolve(null)).catch(()=>null);
  if(!db){S.dbState='off';renderNotas();return}
  S.db=db;
  const tm=setTimeout(()=>{if(S.dbState==='loading'){S.dbState='slow';renderNotas()}},10000);
  db.collection('notas').onSnapshot(s=>{S.notasBrutas=s.docs.map(d=>({seq:d.id,...d.data()}));aplicaQive();if(!s.metadata.fromCache){clearTimeout(tm);S.dbState='ok'}else if(S.dbState==='loading')S.dbState='cache';renderNotas();renderEntrada();renderLancadas()},()=>{clearTimeout(tm);S.dbState='off';renderNotas()});
  db.doc('meta/importador').onSnapshot(s=>{S.meta=s.exists?s.data():null;renderNotas()},()=>{});
  db.collection('qiveStatus').onSnapshot(s=>{S.qiveStatus=s.docs.map(d=>d.data());aplicaQive();renderNotas();renderEntrada();renderLancadas()},()=>{});
  db.collection('qiveRodadas').onSnapshot(s=>{S.qiveRodadas=s.docs.map(d=>d.data());renderNotas()},()=>{});
  db.collection('regras').onSnapshot(s=>{const r={};s.docs.forEach(d=>r[d.id]=d.data());S.regras=r;renderNotas();renderPadrao()},()=>{});
  db.doc('meta/polenta').onSnapshot(s=>{const o=S.polenta;S.polenta=s.exists?s.data():null;if(o?.em!==S.polenta?.em&&S.polenta?.estado!==o?.estado)S.polMin=false;renderPolenta()},()=>{});
  db.doc('meta/periodos').onSnapshot(s=>{S.periodos=s.exists?s.data():null;renderNotas();renderPeriodo()},()=>{});
  db.doc('meta/tempo').onSnapshot(s=>{S.tempo=s.exists?s.data():null;renderLancadas()},()=>{});
}
renderAll();loadFiles();loadDb();
